[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyssp_sysml2"
dynamic = ["version"]
description = "Generate SSP artifacts from a SysML v2 architecture model."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "pyssp contributors" }
]
# Both dependencies are direct URLs, not index lookups: each URL is an
# immutable release asset attached by that package's wheels.yml, its tag is
# v<version>, and an unreleased tag makes the wheel uninstallable.
#   pycps-sysml2      owns the SysML dialect, IR and parameter resolution.
#   experimental-pyssp-standard owns the SSP XML object model.
# sysmlpy is not a direct dependency any more: pycps-sysml2 pins ==0.96.4 and
# this package never imports the grammar.
dependencies = [
    "pycps-sysml2 @ https://github.com/pyssporg/pycps_sysml2/releases/download/v0.2.0/pycps_sysml2-0.2.0-py3-none-any.whl",
    "experimental-pyssp-standard @ https://github.com/pyssporg/experimental_pyssp_standard/releases/download/v0.9.3.dev0/experimental_pyssp_standard-0.9.3.dev0-py3-none-any.whl"
  ]


[project.optional-dependencies]
dev = [
  "pytest"
]

[project.scripts]
pyssp = "pyssp_sysml2.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = { attr = "pyssp_sysml2.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyssp_sysml2*"]

[tool.ruff]
# Lint selection is explicit so a ruff upgrade cannot change the gate.
lint.select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "static: inspects source or files without executing the package",
    "unit: one object's behaviour, no generated artifact",
    "component: a generated artifact is the unit under test",
    "contract: two directions must agree (round-trip, sync)",
    "system: the CLI is driven end to end",
    "slow: not part of the default CI subset",
]
