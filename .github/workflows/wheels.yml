name: wheels

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        # The version is dynamic (attr = pyssp_sysml2.__version__), so the
        # artifact name is checked instead of being assumed.
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --sdist

      - name: Check artifacts
        run: |
          python - <<'PY'
          import pathlib
          import zipfile

          wheels = list(pathlib.Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          wheel = wheels[0]
          assert wheel.name.split("-")[1] != "0.0.0", wheel.name
          with zipfile.ZipFile(wheel) as zf:
              assert zf.testzip() is None
              name = next(n for n in zf.namelist() if n.endswith(".dist-info/METADATA"))
              text = zf.read(name).decode()
          requirements = [
              line.split(":", 1)[1].strip()
              for line in text.splitlines()
              if line.startswith("Requires-Dist:")
          ]
          # A direct URL renders as "name @ url"; assert the owner and the tag.
          assert any(
              r.startswith(
                  "pycps-sysml2 @ https://github.com/pyssporg/pycps_sysml2/"
                  "releases/download/v"
              )
              for r in requirements
          ), requirements
          assert any(
              r.startswith(
                  "experimental-pyssp-standard @ https://github.com/pyssporg/"
                  "experimental_pyssp_standard/releases/download/v"
              )
              for r in requirements
          ), requirements
          # sysmlpy is owned by pycps-sysml2, not required directly here.
          assert not any(r.startswith("sysmlpy") for r in requirements), requirements
          print(wheel.name)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
